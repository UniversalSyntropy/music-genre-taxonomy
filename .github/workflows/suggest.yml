# Turns a "Suggest a link" issue into a pull request that edits contrib/hand-links.yaml.
#
# Setup: the repo setting "Allow GitHub Actions to create and approve pull requests"
# must be on (Settings, Actions, General).
# A pull request that the workflow token opens does not start the CI workflow.
# For that reason this workflow runs tools/check.py itself.
#
# Security: the issue body is untrusted input. It reaches the shell only through
# env variables. Never put an issue text field inside a run script. Never use the title.
# The validate job runs Python with a read-only token and no stored git credentials.
# The publish job has the write token and runs only git and gh, never repo code.
# When a pull request for the issue is already open, an issue edit never changes it,
# so a reviewed pull request cannot change under the reviewer.
name: Suggest

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: suggest-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'suggestion') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      code: ${{ steps.validate.outputs.code }}
    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Validate the suggestion
        id: validate
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/out"
          python tools/suggest.py --issue "$ISSUE_NUMBER" --comment-out "$RUNNER_TEMP/out/comment.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Fail on an internal error
        if: steps.validate.outputs.code != '0' && steps.validate.outputs.code != '1'
        env:
          CODE: ${{ steps.validate.outputs.code }}
        run: |
          echo "tools/suggest.py exited with code $CODE"
          exit 1
      - name: Check the data
        if: steps.validate.outputs.code == '0'
        run: python tools/check.py
      - name: Keep the result
        run: cp contrib/hand-links.yaml "$RUNNER_TEMP/out/hand-links.yaml"
      - uses: actions/upload-artifact@v4
        with:
          name: suggestion
          path: ${{ runner.temp }}/out
          retention-days: 1

  publish:
    needs: validate
    if: needs.validate.outputs.code == '0' || needs.validate.outputs.code == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      CODE: ${{ needs.validate.outputs.code }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: suggestion
          path: ${{ runner.temp }}/out
      - name: Open the pull request
        id: pr
        if: env.CODE == '0'
        run: |
          set -e
          BRANCH="suggest/issue-$ISSUE_NUMBER"
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$EXISTING" ]; then
            printf '\nA pull request for this issue is already open, so this edit did not change it. To suggest something different, close this issue and open a new one.\n' >> "$RUNNER_TEMP/out/comment.md"
            echo "url=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp "$RUNNER_TEMP/out/hand-links.yaml" contrib/hand-links.yaml
          git checkout -B "$BRANCH"
          git add contrib/hand-links.yaml
          if git diff --cached --quiet; then
            echo "No change to commit."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Suggestion from issue #$ISSUE_NUMBER"
          git push --force origin "$BRANCH"
          { echo "Closes #$ISSUE_NUMBER."; echo; cat "$RUNNER_TEMP/out/comment.md"; } > "$RUNNER_TEMP/pr-body.md"
          URL="$(gh pr create --base main --head "$BRANCH" \
            --title "Suggestion from issue #$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/pr-body.md")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment on the issue
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -e
          if [ -n "$PR_URL" ]; then
            printf '\nPull request: %s\n' "$PR_URL" >> "$RUNNER_TEMP/out/comment.md"
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/out/comment.md"
